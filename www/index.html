<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>M.L26</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" href="img/icon-192.png">
  <style>
    body.boot-ready { min-height: 100dvh; }
    #app { padding: 12px 14px calc(18px + env(safe-area-inset-bottom)); }
    .warn { color: #e8b4b4; }
    .ok { color: #9fd4a8; }
    .desk-lock header { position: sticky; top: 0; z-index: 5; }
  </style>
</head>
<body class="boot-ready office-bg">
  <div id="boot">
    <div class="boot-card">
      <img src="img/icon-192.png" alt="M.L26" width="72" height="72">
      <p>M.L26</p>
      <div class="ml-loader" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="boot-word">LOADING</p>
      <div class="boot-bar"><i id="boot-fill"></i></div>
      <p id="boot-pct">0%</p>
    </div>
  </div>
  <div id="app"></div>
  <script src="js/app.js"></script>
</body>
</html>
